<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title description">
  <title id="title">Build flow</title>
  <desc id="description">A neon purple workflow infographic: imagine, build, refine, and repeat.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11101e"/>
      <stop offset="1" stop-color="#17152b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bb70ff"/>
      <stop offset="0.52" stop-color="#8055ff"/>
      <stop offset="1" stop-color="#54a5ff"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241b3d"/>
      <stop offset="1" stop-color="#171a31"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="228" rx="22" fill="url(#panel)" stroke="#514273" stroke-opacity=".8" stroke-width="2"/>
  <path d="M92 106H908" fill="none" stroke="#483568" stroke-width="3"/>
  <path d="M92 106H908" fill="none" stroke="url(#line)" stroke-width="2"/>
  <path d="m895 97 14 9-14 9" fill="none" stroke="#7f79ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="46" fill="#aaa0c4" font-size="12" font-weight="700" letter-spacing="2">THE BUILD LOOP</text>

    <g transform="translate(52 68)">
      <rect width="190" height="78" rx="16" fill="url(#tile)" stroke="#a76bff" stroke-opacity=".8"/>
      <circle cx="34" cy="39" r="20" fill="#34234f" stroke="#c38aff"/>
      <path d="M34 27v24M27 34h14M29 43l5-5 5 5" fill="none" stroke="#e4ccff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
      <text x="66" y="35" fill="#f3edff" font-size="17" font-weight="700">IMAGINE</text>
      <text x="66" y="56" fill="#aaa0c4" font-size="12">Start with a spark</text>
      <circle cx="190" cy="38" r="5" fill="#d0a1ff"/>
    </g>

    <g transform="translate(292 68)">
      <rect width="190" height="78" rx="16" fill="url(#tile)" stroke="#8b68ff" stroke-opacity=".8"/>
      <circle cx="34" cy="39" r="20" fill="#29244d" stroke="#9e8aff"/>
      <path d="m27 34 7-6 7 6M34 29v19M27 45h14" fill="none" stroke="#dcd5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
      <text x="66" y="35" fill="#f3edff" font-size="17" font-weight="700">BUILD</text>
      <text x="66" y="56" fill="#aaa0c4" font-size="12">Make it work</text>
      <circle cx="190" cy="38" r="5" fill="#a898ff"/>
    </g>

    <g transform="translate(532 68)">
      <rect width="190" height="78" rx="16" fill="url(#tile)" stroke="#716dff" stroke-opacity=".8"/>
      <circle cx="34" cy="39" r="20" fill="#22294b" stroke="#7f9bff"/>
      <path d="m27 39 5 5 10-11M27 29h7M27 49h13" fill="none" stroke="#d2e0ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
      <text x="66" y="35" fill="#f3edff" font-size="17" font-weight="700">REFINE</text>
      <text x="66" y="56" fill="#aaa0c4" font-size="12">Polish the details</text>
      <circle cx="190" cy="38" r="5" fill="#83a6ff"/>
    </g>

    <g transform="translate(772 68)">
      <rect width="176" height="78" rx="16" fill="url(#tile)" stroke="#568cff" stroke-opacity=".8"/>
      <circle cx="34" cy="39" r="20" fill="#1e2b4a" stroke="#71b4ff"/>
      <path d="M41 34a9 9 0 1 0 1 9M41 29v7h-7" fill="none" stroke="#d1efff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
      <text x="66" y="35" fill="#f3edff" font-size="17" font-weight="700">REPEAT</text>
      <text x="66" y="56" fill="#aaa0c4" font-size="12">Learn, then level up</text>
    </g>
  </g>

  <text x="52" y="190" fill="#817a99" font-family="Consolas, monospace" font-size="12">curiosity.init()</text>
  <text x="829" y="190" fill="#817a99" font-family="Consolas, monospace" font-size="12">ship_with_care();</text>
</svg>
