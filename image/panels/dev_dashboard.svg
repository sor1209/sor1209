<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">sor1209 developer dashboard</title>
  <desc id="description">A custom dark developer dashboard introducing sor1209 and highlighting web, bots, games, UI/UX, and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b17"/>
      <stop offset=".58" stop-color="#17122d"/>
      <stop offset="1" stop-color="#101c38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2=".3">
      <stop offset="0" stop-color="#dc75ff"/>
      <stop offset=".52" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#55b5ff"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#8957ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8957ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ad8bff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="26" fill="url(#bg)" stroke="#624c9b" stroke-opacity=".8" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="356" rx="25" fill="url(#grid)"/>
  <circle cx="1065" cy="72" r="220" fill="url(#orb)"/>
  <circle cx="1040" cy="350" r="210" fill="url(#orb)"/>
  <path d="M34 22H470" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="54" y="45" width="154" height="30" rx="15" fill="#211935" stroke="#8e67d5" stroke-opacity=".8"/>
    <circle cx="73" cy="60" r="5" fill="#9c7aff"/>
    <text x="88" y="65" fill="#d9cbff" font-size="12" font-weight="700" letter-spacing="1.7">DEVELOPER PROFILE</text>

    <text x="52" y="161" fill="#fff" font-size="68" font-weight="750" letter-spacing="-2">sor1209</text>
    <rect x="56" y="180" width="236" height="4" rx="2" fill="url(#accent)"/>
    <text x="54" y="224" fill="#d4cde4" font-size="22">Full-stack developer</text>
    <text x="54" y="255" fill="#a9a2bb" font-size="16">Turning ideas into useful things for the web and beyond.</text>

    <g transform="translate(54 291)">
      <rect width="142" height="34" rx="17" fill="#201a32" stroke="#795db0"/>
      <text x="71" y="22" text-anchor="middle" fill="#e1d5ff" font-size="11" font-weight="700" letter-spacing=".5">WEB EXPERIENCES</text>
      <rect x="151" width="116" height="34" rx="17" fill="#201a32" stroke="#795db0"/>
      <text x="209" y="22" text-anchor="middle" fill="#e1d5ff" font-size="11" font-weight="700" letter-spacing=".5">DISCORD BOTS</text>
      <rect x="276" width="96" height="34" rx="17" fill="#201a32" stroke="#795db0"/>
      <text x="324" y="22" text-anchor="middle" fill="#e1d5ff" font-size="11" font-weight="700" letter-spacing=".5">GAME DEV</text>
      <rect x="381" width="112" height="34" rx="17" fill="#201a32" stroke="#795db0"/>
      <text x="437" y="22" text-anchor="middle" fill="#e1d5ff" font-size="11" font-weight="700" letter-spacing=".5">AUTOMATION</text>
    </g>
  </g>

  <g transform="translate(650 48)">
    <rect width="492" height="282" rx="18" fill="#0b0d18" stroke="#5d4c83" stroke-width="1.5"/>
    <path d="M0 47H492" stroke="#342b48"/>
    <circle cx="24" cy="23" r="5" fill="#ff6c91"/>
    <circle cx="43" cy="23" r="5" fill="#ffc45c"/>
    <circle cx="62" cy="23" r="5" fill="#79e3a1"/>
    <text x="90" y="28" fill="#8d87a5" font-family="Consolas, monospace" font-size="12">~/sor1209 — zsh</text>
    <g font-family="Consolas, monospace" font-size="13">
      <text x="27" y="83" fill="#bd8cff">$</text>
      <text x="47" y="83" fill="#f1ecff">whoami</text>
      <text x="27" y="112" fill="#aaa3bd">full-stack developer</text>
      <text x="27" y="148" fill="#bd8cff">$</text>
      <text x="47" y="148" fill="#f1ecff">focus --on</text>
      <text x="27" y="174" fill="#80c7ff">web</text>
      <text x="66" y="174" fill="#77718e">·</text>
      <text x="80" y="174" fill="#ca9fff">discord bots</text>
      <text x="180" y="174" fill="#77718e">·</text>
      <text x="194" y="174" fill="#81e6b0">games</text>
      <text x="27" y="196" fill="#c6a9ff">UI/UX</text>
      <text x="66" y="196" fill="#77718e">·</text>
      <text x="80" y="196" fill="#81e6b0">automation</text>
      <text x="27" y="231" fill="#bd8cff">$</text>
      <text x="47" y="231" fill="#f1ecff">keep_learning --by</text>
      <text x="27" y="253" fill="#aaa3bd">building, debugging, sharing, improving</text>
    </g>
    <rect x="190" y="220" width="8" height="15" rx="1" fill="#bd8cff"/>
    <path d="M27 266H465" stroke="url(#accent)" stroke-opacity=".8"/>
    <text x="27" y="278" fill="#77718e" font-family="Consolas, monospace" font-size="9">STATUS: CURIOUS · ALWAYS BUILDING</text>
  </g>
</svg>
